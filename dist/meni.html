   ============================================================ */

:root {
  --cream: #FAF3E2;  /* the page — real cream, not mint */
  --paper: #FFFDF6;  /* cards — warm white */
  --sage: #E4EDD3;   /* selected states and garden accents only */
  --bubble: #F2E6C8; /* Meni's speech — warm straw */
  --white: #FFFDF6;
  --navy: #1B2036;
  --navy-soft: #3A405C;
  --orange: #E8872B;
  --orange-soft: #E4EDD3; /* alias kept for older rules; sage */
  --orange-pale: #F6C08A;
  --brown: #6B3E14;
  --toy-red: #D6452B;
  --gold: #F2B33D;
  --gold-deep: #C9A227;

  --shadow: 0 1px 2px rgba(107, 62, 20, 0.06), 0 4px 10px rgba(107, 62, 20, 0.10);
  --shadow-lift: 0 10px 24px rgba(107, 62, 20, 0.16);

  /* A = 1, AA = 1.2, AAA = 1.45 — set on <html> by the size chooser */
  --scale: 1;

  --radius: 20px;
  --touch: 60px;
  --gap: 14px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  /* True cream with a whisper of paper grain (5% brown noise, inline SVG). */
  background-color: var(--cream);
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.24 0 0 0 0 0.08 0 0 0 0.05 0"/></filter><rect width="180" height="180" filter="url(%23n)"/></svg>');
  color: var(--navy);
  font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: calc(1.125rem * var(--scale)); /* 18px base before scaling */
  line-height: 1.55;
  min-height: 100vh;
}

#app {
  max-width: 480px;
  margin: 0 auto;
  padding: 14px 20px 36px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

main {
  animation: screen-in 0.28s ease both;
}

@keyframes screen-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  main { animation: none; }
}

/* ---------- Header (same on every screen: familiarity rule) ---------- */

header.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--gap);
  padding: 6px 0 14px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: "Fraunces", Georgia, serif;
  font-weight: 600;
  font-size: calc(1.3rem * var(--scale));
  letter-spacing: 0.01em;
}

.brand svg {
  width: 42px;
  height: 42px;
  flex: none;
}

/* ---------- Buttons: soft pills that clearly look pressable ---------- */

button {
  font: inherit;
  font-weight: 700;
  color: var(--navy);
  border-radius: 999px;
  min-height: var(--touch);
  padding: 14px 24px;
  cursor: pointer;
  text-align: center;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: background-color 0.18s ease, box-shadow 0.18s ease, transform 0.08s ease;
}

button:focus-visible {
  /* Navy ring: 14:1 on cream and paper — the orange ring failed 3:1. */
  outline: 3px solid var(--navy);
  outline-offset: 3px;
}

/* Pressed like a real toy button: a solid edge that gives under the thumb. */
.btn-primary {
  background: var(--navy);
  color: var(--cream);
  border: none;
  box-shadow: 0 4px 0 #0E1122, 0 6px 14px rgba(107, 62, 20, 0.14);
  font-weight: 700;
}

.btn-primary:active {
  background: var(--navy-soft);
  transform: translateY(3px);
  box-shadow: 0 1px 0 #0E1122;
}

.btn-secondary {
  background: var(--paper);
  color: var(--navy);
  border: 2px solid var(--navy);
  box-shadow: 0 3px 0 rgba(27, 32, 54, 0.25);
}

.btn-secondary:active {
  background: var(--sage);
  transform: translateY(2px);
  box-shadow: 0 1px 0 rgba(27, 32, 54, 0.25);
}

.btn-quiet {
  background: none;
  border: none;
  color: var(--navy-soft);
  text-decoration: underline;
  text-underline-offset: 3px;
  font-weight: 700;
  box-shadow: none;
}

.btn-small {
  width: auto;
  min-height: 60px; /* every control honors the senior touch standard */
  padding: 8px 18px;
  font-size: calc(0.95rem * var(--scale));
  white-space: nowrap;
}

button.selected {
  border: 3px solid var(--navy);
  background: var(--sage);
  color: var(--navy);
  box-shadow: inset 0 2px 0 rgba(107, 62, 20, 0.08);
}

/* Answer choices: two equal buttons — never a highlighted "right" one. */
.btn-choice {
  background: var(--paper);
  color: var(--navy);
  border: 2px solid var(--navy);
  box-shadow: 0 3px 0 rgba(27, 32, 54, 0.25);
  font-weight: 700;
}

.btn-choice:active {
  background: var(--sage);
  transform: translateY(2px);
  box-shadow: 0 1px 0 rgba(27, 32, 54, 0.25);
}

button:disabled {
  opacity: 0.5;
  cursor: default;
  box-shadow: none;
}

.btn-stack {
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  margin-top: 18px;
}

/* ---------- Text ---------- */

h1 {
  font-family: "Fraunces", Georgia, serif;
  font-size: calc(1.75rem * var(--scale));
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.01em;
  margin-bottom: 10px;
}

h2 {
  font-family: "Fraunces", Georgia, serif;
  font-size: calc(1.35rem * var(--scale));
  font-weight: 600;
  line-height: 1.3;
  margin-bottom: 10px;
}

p {
  margin-bottom: 12px;
}

/* Navy carries the words; the orange lives in a little leading dot. */
.eyebrow {
  font-size: calc(0.95rem * var(--scale));
  font-weight: 700;
  color: var(--navy);
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}

.eyebrow::before {
  content: "";
  display: inline-block;
  width: 0.6em;
  height: 0.6em;
  border-radius: 50%;
  background: var(--orange);
  margin-right: 8px;
  vertical-align: baseline;
}

.teach-text {
  font-size: calc(1.22rem * var(--scale));
  line-height: 1.6;
}

.question-text {
  font-family: "Fraunces", Georgia, serif;
  font-size: calc(1.35rem * var(--scale));
  font-weight: 600;
  line-height: 1.35;
  margin-bottom: 6px;
}

/* ---------- Cards: white surfaces on the cream world ---------- */

.card {
  background: var(--white);
  border: none;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 22px;
  margin-top: 16px;
}

.card-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.card-row svg {
  width: 30px;
  height: 30px;
  flex: none;
  margin-top: 2px;
  color: var(--orange);
}

/* ---------- Meni speaks: feedback as a speech bubble ---------- */

.meni-says {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  margin-top: 18px;
}

.meni-says .meni-avatar {
  width: 74px;
  flex: none;
}

.meni-says .meni-avatar svg {
  width: 100%;
  height: auto;
  display: block;
}

.bubble {
  position: relative;
  background: var(--bubble);
  border: 1.5px solid rgba(107, 62, 20, 0.28);
  border-radius: var(--radius);
  padding: 16px 18px;
  flex: 1;
  box-shadow: none; /* speech is printed on the page, not floating */
}

.bubble::before {
  content: "";
  position: absolute;
  left: -9px;
  bottom: 18px;
  width: 16px;
  height: 16px;
  background: var(--bubble);
  border-left: 1.5px solid rgba(107, 62, 20, 0.28);
  border-bottom: 1.5px solid rgba(107, 62, 20, 0.28);
  transform: rotate(45deg);
  border-radius: 0 0 0 4px;
}

/* ---------- Step dots: quiet wayfinding, no words needed ---------- */

.step-dots {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: flex-end;
  margin: 2px 0 14px;
}

.step-dots span {
  display: inline-flex;
  opacity: 0.3;
}

.step-dots span.on {
  opacity: 1;
}

/* ---------- Scam-alert styling: the ONLY place red means alarm ---------- */

.alert-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--paper);
  border: 3px solid var(--toy-red);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 12px 16px;
  margin-bottom: 14px;
  font-weight: 700;
  /* Darker than the border red: banner TEXT must clear 4.5:1 on paper. */
  color: #B33418;
}

.alert-banner svg {
  width: 28px;
  height: 28px;
  flex: none;
}

/* ---------- Size chooser ---------- */

.hello-stage {
  display: flex;
  justify-content: center;
  margin: 6px 0 14px;
}

.hello-stage .disc {
  background: radial-gradient(closest-side, #F3E3BC 76%, transparent 77%);
  padding: 26px 34px 10px;
}

.hello-stage svg {
  width: min(44vw, 180px);
  height: auto;
  display: block;
}

.size-row {
  display: flex;
  gap: var(--gap);
  margin: 16px 0 4px;
}

.size-row button {
  flex: 1;
  border-radius: var(--radius);
  background: var(--paper);
  border: 2px solid var(--navy);
  box-shadow: 0 3px 0 rgba(27, 32, 54, 0.25);
  font-weight: 700;
  flex-direction: column;
  gap: 2px;
  min-height: 80px;
}

.size-row .size-a { font-size: 1.125rem; }
.size-row .size-aa { font-size: 1.35rem; }
.size-row .size-aaa { font-size: 1.63rem; }

.size-label {
  font-size: calc(0.85rem * var(--scale));
  font-weight: 400;
}

/* ---------- Gentle motion (off for reduced-motion users) ---------- */

.garden-hero .sway {
  transform-box: fill-box;
  transform-origin: 50% 100%;
}

@media (prefers-reduced-motion: no-preference) {
  .hello-stage svg,
  .meni-says .meni-avatar svg {
    animation: bob 3.2s ease-in-out infinite;
  }
  .garden-hero .sway {
    animation: sway 4s ease-in-out infinite;
  }
  .garden-hero .sway:nth-child(2n) { animation-delay: -1.3s; }
  .garden-hero .sway:nth-child(3n) { animation-delay: -2.1s; }
}

@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

@keyframes sway {
  0%, 100% { transform: rotate(-1.6deg); }
  50% { transform: rotate(1.6deg); }
}

/* ---------- Garden ---------- */

.garden-hero {
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-lift);
  margin: 14px 0 4px;
  line-height: 0;
}

.garden-hero svg {
  width: 100%;
  height: auto;
  display: block;
}

.lessons-learned {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.lessons-learned .big {
  font-family: "Fraunces", Georgia, serif;
  font-size: calc(2.2rem * var(--scale));
  font-weight: 600;
  color: var(--navy); /* navy is the ink — orange never carries text */
}

.lessons-learned .rest {
  font-size: calc(1.2rem * var(--scale));
  font-weight: 700;
}

.saved-questions ul {
  list-style: none;
  margin-top: 8px;
}

.saved-questions li {
  background: var(--sage);
  border-radius: 14px;
  padding: 12px 16px;
  margin-bottom: 8px;
  font-weight: 400;
}

/* ---------- Setup screen ---------- */

.setup-field {
  margin-top: 20px;
}

.setup-field label {
  display: block;
  font-weight: 700;
  margin-bottom: 8px;
}

input[type="date"],
input[type="number"] {
  font: inherit;
  color: var(--navy);
  background: var(--white);
  border: 2px solid var(--navy);
  border-radius: 14px;
  box-shadow: var(--shadow);
  min-height: var(--touch);
  padding: 12px 16px;
  width: 100%;
}

input[type="date"]:focus-visible,
input[type="number"]:focus-visible {
  outline: 3px solid var(--orange);
  outline-offset: 3px;
}

/* ---------- Utility ---------- */

.center { text-align: center; }

/* Focus moved by script after a screen change (screen-reader wayfinding):
   no visible ring — keyboard users still get rings on real controls. */
[tabindex="-1"]:focus { outline: none; }

.footnote {
  font-size: calc(0.92rem * var(--scale));
  color: var(--navy-soft);
  margin-top: 26px;
}

[hidden] { display: none !important; }

/* "Read it to me" is a helper, not the lesson: a compact chip, left-aligned,
   still a full 60px touch target. */
.read-chip {
  width: auto;
  align-self: flex-start;
  padding: 12px 20px;
  min-height: 60px;
}

/* ---------- The life layer: blink, talk, wave, bloom, visitors ----------
   Every animation is gentle, starts only after the learner acts or as
   ambient garden motion, and switches off under reduced motion. */

.m-eyes {
  transform-box: fill-box;
  transform-origin: 50% 55%;
}

.m-mouth-open { opacity: 0; }

/* While speech plays, Meni talks (static open mouth if motion is reduced) */
.talking .m-mouth-open { opacity: 1; }
.talking .m-mouth-closed { opacity: 0; }

.m-arm {
  transform-box: fill-box;
  transform-origin: 30% 88%;
}

.bloom-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
}

.bloom-row svg {
  width: 74px;
  height: auto;
  flex: none;
}

/* The bloom caption doubles as the done-screen heading (h1) so screen
   readers land on the celebration — sized as a caption, not a banner. */
.bloom-caption {
  font-family: "Fraunces", Georgia, serif;
  font-size: calc(1.15rem * var(--scale));
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 0;
}

button.is-done {
  opacity: 0.7;
  box-shadow: none;
}

.bloom-stem,
.bloom-head {
  transform-box: fill-box;
}

.bloom-stem { transform-origin: 50% 100%; }
.bloom-head { transform-origin: 50% 60%; }

.v-wing-l,
.v-wing-r,
.v-drift,
.v-bob,
.v-float {
  transform-box: fill-box;
}

.v-wing-l { transform-origin: 100% 50%; }
.v-wing-r { transform-origin: 0% 50%; }

@media (prefers-reduced-motion: no-preference) {
  .m-eyes { animation: m-blink 5.4s infinite; }
  .meni-says .m-eyes { animation-delay: 1.2s; }

  .talking .m-mouth-open { animation: m-talk-open 0.55s infinite; }
  .talking .m-mouth-closed { animation: m-talk-closed 0.55s infinite; }

  .m-arm { animation: m-wave 1.9s ease-in-out infinite; }

  .bloom-stem { animation: bloom-grow 0.9s ease-out both; }
  .bloom-head { animation: bloom-pop 0.7s 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

  .v-wing-l { animation: flutter-l 0.5s ease-in-out infinite alternate; }
  .v-wing-r { animation: flutter-r 0.5s ease-in-out infinite alternate; }
  .v-drift { animation: v-drift 8s ease-in-out infinite alternate; }
  .v-bob { animation: v-bob 3.2s ease-in-out infinite; }
  .v-float { animation: v-bob 5s ease-in-out infinite; }
}

@keyframes m-blink {
  0%, 94%, 100% { transform: scaleY(1); }
  96.5% { transform: scaleY(0.1); }
}

@keyframes m-talk-open {
  0%, 44% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

@keyframes m-talk-closed {
  0%, 44% { opacity: 0; }
  50%, 100% { opacity: 1; }
}

@keyframes m-wave {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-13deg); }
}

@keyframes bloom-grow {
  from { transform: scaleY(0); }
}

@keyframes bloom-pop {
  from { transform: scale(0); }
}

@keyframes flutter-l { to { transform: scaleX(0.5); } }
@keyframes flutter-r { to { transform: scaleX(0.5); } }

@keyframes v-drift {
  0% { transform: translate(0, 0); }
  100% { transform: translate(10px, -6px); }
}

@keyframes v-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* ---------- Favorite flower chooser (first run, one tap) ---------- */

.color-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--gap);
  margin-top: 14px;
}

.color-grid .color-pick {
  flex-direction: column;
  gap: 6px;
  min-height: 108px;
  border-radius: var(--radius);
  background: var(--white);
  border: 2px solid var(--navy);
  box-shadow: var(--shadow);
  padding: 12px 8px;
  font-weight: 700;
}

.color-grid .color-pick svg {
  width: 40px;
  height: 52px;
}

/* ---------- Watering day, skills, prompt cards ---------- */

.eyebrow svg {
  width: 20px;
  height: 20px;
  vertical-align: -3px;
  margin-right: 2px;
}

.prompt-card {
  background: var(--orange-soft);
  box-shadow: none;
  font-weight: 600;
}

.bloom-skill {
  display: block;
  font-size: calc(0.95rem * var(--scale));
  color: var(--navy-soft);
  font-weight: 600;
  margin-top: 2px;
}

.sparkle { opacity: 0.9; }

@media (prefers-reduced-motion: no-preference) {
  .sparkle {
    animation: sparkle-pulse 1.6s ease-in-out infinite;
  }
}

@keyframes sparkle-pulse {
  0%, 100% { opacity: 0.25; }
  50% { opacity: 1; }
}

</style>

<body>
  <div id="app">
    <noscript>
      <p style="padding:24px;font-size:18px">
        Meni needs JavaScript to work. Please ask your helper to turn it on,
        or bring your phone to office hours and we will set it up together.
      </p>
    </noscript>
  </div>
  <script>
/* Meni the bear — original illustrated character inspired by the vintage toy.
   Style: soft flat (no hard outlines) — modern mascot, not clip-art.
   Kept from the toy's DNA: warm orange body, pale round belly and muzzle,
   oversized navy eyes, the little red tuft on top, stubby seated pose.
   Meni is never angry, never sad, never disappointed — he celebrates,
   wonders, and welcomes.

   Expressions: "smile" (default), "delighted" (open happy mouth with
   tongue), "curious" (head tilt + little round mouth).

   Animation hooks (all driven by CSS, all off under reduced motion):
   - .m-eyes    blinks every few seconds
   - .m-mouth-closed / .m-mouth-open   swap while a .meni-holder
                ancestor has the "talking" class (Read it to me)
   - .m-arm     gentle wave on the waving pose */

const MENI_COLORS = {
  body: "#E8872B",
  deep: "#D06A10", // limbs and ears: clearly deeper so two-tone reads as intent
  pale: "#F6C08A",
  blush: "#F49B6A",
  line: "#6B3E14",
  eyes: "#1B2036",
  red: "#D6452B",
  glint: "#FFFFFF",
};

function meniHead(cx, cy, s, expr = "smile") {
  const c = MENI_COLORS;

  let closedMouth;
  if (expr === "curious") {
    closedMouth = `<circle cx="${cx}" cy="${cy + 20 * s}" r="${2.8 * s}" fill="${c.line}" class="m-mouth-closed"/>`;
  } else if (expr === "delighted") {
    closedMouth = `<g class="m-mouth-closed">
      <path d="M${cx - 7 * s} ${cy + 17 * s} Q${cx} ${cy + 27 * s} ${cx + 7 * s} ${cy + 17 * s} Z" fill="${c.line}"/>
      <ellipse cx="${cx}" cy="${cy + 21.5 * s}" rx="${3.4 * s}" ry="${2 * s}" fill="${c.blush}"/>
    </g>`;
  } else {
    closedMouth = `<path d="M${cx} ${cy + 13.5 * s} v${3.5 * s} M${cx - 6 * s} ${cy + 18 * s} Q${cx} ${cy + 22.5 * s} ${cx + 6 * s} ${cy + 18 * s}" fill="none" stroke="${c.line}" stroke-width="${2.2 * s}" stroke-linecap="round" class="m-mouth-closed"/>`;
  }
  const openMouth = `<ellipse cx="${cx}" cy="${cy + 19.5 * s}" rx="${4.8 * s}" ry="${3.8 * s}" fill="${c.line}" class="m-mouth-open"/>`;

  const tilt = expr === "curious" ? ` transform="rotate(-6 ${cx} ${cy + 34 * s})"` : "";

  return `<g${tilt}>
    <circle cx="${cx - 33 * s}" cy="${cy - 36 * s}" r="${13.5 * s}" fill="${c.deep}"/>
    <circle cx="${cx + 33 * s}" cy="${cy - 35 * s}" r="${12.6 * s}" fill="${c.deep}" transform="rotate(8 ${cx + 33 * s} ${cy - 35 * s})"/>
    <circle cx="${cx - 33 * s}" cy="${cy - 36 * s}" r="${6.5 * s}" fill="${c.pale}"/>
    <circle cx="${cx + 33 * s}" cy="${cy - 35 * s}" r="${5.9 * s}" fill="${c.pale}"/>
    <ellipse cx="${cx + 1 * s}" cy="${cy - 42 * s}" rx="${5.2 * s}" ry="${7.5 * s}" fill="${c.red}" transform="rotate(9 ${cx} ${cy - 42 * s})"/>
    <ellipse cx="${cx - 4 * s}" cy="${cy - 40 * s}" rx="${3 * s}" ry="${4.6 * s}" fill="${c.red}" transform="rotate(-14 ${cx - 4 * s} ${cy - 40 * s})"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${44 * s}" ry="${40 * s}" fill="${c.body}"/>
    <ellipse cx="${cx}" cy="${cy + 14 * s}" rx="${17 * s}" ry="${13 * s}" fill="${c.pale}"/>
    <circle cx="${cx - 29 * s}" cy="${cy + 10 * s}" r="${6 * s}" fill="${c.blush}" opacity="0.55"/>
    <circle cx="${cx + 29 * s}" cy="${cy + 10 * s}" r="${6 * s}" fill="${c.blush}" opacity="0.55"/>
    <g class="m-eyes">
      <ellipse cx="${cx - 16 * s}" cy="${cy - 5 * s}" rx="${7 * s}" ry="${8 * s}" fill="${c.eyes}"/>
      <ellipse cx="${cx + 16 * s}" cy="${cy - 5 * s}" rx="${7 * s}" ry="${8 * s}" fill="${c.eyes}"/>
      <circle cx="${cx - 13.5 * s}" cy="${cy - 8 * s}" r="${2.2 * s}" fill="${c.glint}"/>
      <circle cx="${cx + 18.5 * s}" cy="${cy - 8 * s}" r="${2.2 * s}" fill="${c.glint}"/>
      <circle cx="${cx - 18.5 * s}" cy="${cy - 2.5 * s}" r="${1 * s}" fill="${c.glint}" opacity="0.85"/>
      <circle cx="${cx + 13.5 * s}" cy="${cy - 2.5 * s}" r="${1 * s}" fill="${c.glint}" opacity="0.85"/>
    </g>
    <path d="M${cx - 5 * s} ${cy + 9 * s} Q${cx} ${cy + 6.5 * s} ${cx + 5 * s} ${cy + 9 * s} Q${cx + 5 * s} ${cy + 13.5 * s} ${cx} ${cy + 14.5 * s} Q${cx - 5 * s} ${cy + 13.5 * s} ${cx - 5 * s} ${cy + 9 * s} Z" fill="${c.red}"/>
    ${closedMouth}
    ${openMouth}
  </g>`;
}

function meniBody(waving) {
  const c = MENI_COLORS;
  /* Arms tuck under the body ellipse so they read as one plush shape. */
  const leftArm = `<ellipse cx="62" cy="138" rx="13" ry="27" transform="rotate(26 62 138)" fill="${c.deep}"/>`;
  /* The waving arm sits in a clean group so the CSS wave animation can
     rotate it without fighting an attribute transform. */
  const rightArm = waving
    ? `<g class="m-arm"><g>
         <ellipse cx="148" cy="118" rx="12.5" ry="27" transform="rotate(28 148 118)" fill="${c.deep}"/>
         <circle cx="159" cy="96.5" r="6.5" fill="${c.pale}"/>
       </g></g>`
    : `<ellipse cx="138" cy="138" rx="13" ry="27" transform="rotate(-26 138 138)" fill="${c.deep}"/>`;
  return `
    ${leftArm}
    ${rightArm}
    <ellipse cx="100" cy="152" rx="50" ry="48" fill="${c.body}"/>
    <ellipse cx="100" cy="162" rx="29" ry="27" fill="${c.pale}"/>
    <path d="M84 176 Q100 184 116 176" fill="none" stroke="${c.deep}" stroke-width="1.6" stroke-dasharray="4 5" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="63" cy="195" rx="20" ry="13" fill="${c.deep}"/>
    <ellipse cx="137" cy="195" rx="20" ry="13" fill="${c.deep}"/>
    <ellipse cx="63" cy="197" rx="10" ry="6.5" fill="${c.pale}"/>
    <ellipse cx="137" cy="197" rx="10" ry="6.5" fill="${c.pale}"/>
  `;
}

const MENI = {
  /* Head-only badge for the header and small sizes. */
  mark(expr = "smile") {
    return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      ${meniHead(60, 64, 1, expr)}
    </svg>`;
  },

  /* Seated pose, closest to the toy. Default character. */
  classic(expr = "smile") {
    return `<svg viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      ${meniBody(false)}
      ${meniHead(100, 70, 0.92, expr)}
    </svg>`;
  },

  /* Bare group for placing Meni inside another SVG scene (the garden).
     Draws at 200x230 design size, scaled and positioned by the caller. */
  group(pose, expr, scale, x, y) {
    return `<g transform="translate(${x} ${y}) scale(${scale})">
      ${meniBody(pose === "waving")}
      ${meniHead(100, 70, 0.92, expr)}
    </g>`;
  },

  /* One arm raised, for greetings and celebrations. */
  waving(expr = "smile") {
    return `<svg viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      ${meniBody(true)}
      ${meniHead(100, 70, 0.92, expr)}
    </svg>`;
  },
};

let STRINGS = I18N.en;

function setLang(lang) {
  state.lang = lang === "es" ? "es" : "en";
  STRINGS = I18N[state.lang];
  document.documentElement.lang = state.lang;
}

const SCALES = { A: 1, AA: 1.2, AAA: 1.45 };

/* ---------------- Local state (this phone only) ---------------- */

const STORE_KEY = "meni.v1";

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return Object.assign(defaultState(), JSON.parse(raw));
  } catch (e) {
    /* Unreadable state: start fresh rather than break. */
  }
  return defaultState();
}

function defaultState() {
  return {
    lang: null, // 'en' | 'es' — chosen on the very first screen
    textScale: null, // 'A' | 'AA' | 'AAA'
    pack: "everyday",
    officeHoursDate: null, // 'YYYY-MM-DD'
    completed: [], // [{ id, date }]
    lastVisit: null, // 'YYYY-MM-DD'
    saved: [], // [{ title, question }]
    chime: true, // soft chime when a flower grows
    voice: { en: null, es: null }, // preferred read-aloud voice name per language
    watered: [], // watering-day reviews: [{ id, date }] — spaced repetition
    favAsked: false, // has the favorite-color question been offered?
    favColor: null, // index into GARDEN.flowers, or null for the full mix
  };
}

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e) {
    /* Storage full or blocked: the app still works for this visit. */
  }
}

let state = loadState();

/* ---------------- Dates (always the phone’s local date) ---------------- */

function todayStr() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${mm}-${dd}`;
}

function daysBetween(a, b) {
  const [ay, am, ad] = a.split("-").map(Number);
  const [by, bm, bd] = b.split("-").map(Number);
  return Math.round((new Date(by, bm - 1, bd) - new Date(ay, am - 1, ad)) / 86400000);
}

function friendlyDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(STRINGS.dateLocale, {
    month: "long",
    day: "numeric",
  });
}

function greeting() {
  const h = new Date().getHours();
  if (h < 12) return STRINGS.morning;
  if (h < 17) return STRINGS.afternoon;
  return STRINGS.evening;
}

/* ---------------- Lesson progress ---------------- */

function sequence() {
  return lessonSequence(state.pack, state.lang);
}

function isCompleted(id) {
  return state.completed.some((c) => c.id === id);
}

function nextLesson() {
  return sequence().find((l) => !isCompleted(l.id)) || null;
}

function completedToday() {
  const t = todayStr();
  return state.completed.some((c) => c.date === t);
}

function wateredToday() {
  const t = todayStr();
  return state.watered.some((w) => w.date === t);
}

/* Spaced repetition: once 3 flowers exist, every 4th day revisits an
   old lesson instead of starting a new one — framed as watering. */
function isWateringDay() {
  return (
    state.completed.length >= 3 &&
    (state.completed.length + state.watered.length) % 4 === 3
  );
}

function wateringLesson() {
  const idx = state.watered.length % state.completed.length;
  const id = state.completed[idx].id;
  return { lesson: sequence().find((l) => l.id === id) || null, idx };
}

function completeLesson(id) {
  if (!isCompleted(id)) {
    state.completed.push({ id, date: todayStr() });
    saveState();
  }
}

/* Answers appear in a per-lesson-per-day order and identical styling, so
   the right answer is never "the highlighted top button" — that would
   turn every question into button recognition instead of remembering.
   Deterministic within a day: reopening the screen keeps the order. */
function orderedAnswers(lesson) {
  const seed = (lesson.id + todayStr())
    .split("")
    .reduce((a, c) => a + c.charCodeAt(0), 0);
  const idxs = seed % 2 === 0 ? [0, 1] : [1, 0];
  return idxs.map((i) => ({ label: lesson.answers[i].label, i }));
}

function answersMarkup(lesson) {
  return orderedAnswers(lesson)
    .map(
      (a) => `
      <button type="button" class="btn-choice" data-answer="${a.i}">
        ${esc(a.label)}
      </button>`
    )
    .join("");
}

function answersSpeech(lesson) {
  const labels = orderedAnswers(lesson).map((a) => a.label);
  return `${STRINGS.choicesAre} ${labels.join(`${STRINGS.orWord} `)}.`;
}

/* ---------------- Text size ---------------- */

function applyScale(name) {
  document.documentElement.style.setProperty("--scale", SCALES[name] || 1);
}

/* ---------------- Audio: "Read it to me" ----------------
   Two tiers, best first:
   1. A real human recording, if one exists for this lesson and language
      (see audio/README and tools/record-audio.html — the manifest in
      js/audio-manifest.js lists what has been recorded).
   2. The phone’s own voice — but never the robotic default. We score
      every installed voice and pick the most natural one (phones ship
      "enhanced"/"natural" voices that the default API call ignores),
      and the facilitator can pick a specific voice in setup. */

let speaking = false;
let audioEl = null;

/* A human recording beats any synthesis. Files live in audio/<lang>/. */
function clipUrl(lessonId, part) {
  if (typeof AUDIO_FILES === "undefined") return null;
  return AUDIO_FILES[`${state.lang}/${lessonId}.${part}`] || null;
}

/* Rank the phone’s installed voices for a language: prefer the natural/
   enhanced ones phones hide behind the robotic default, prefer on-device
   voices (work offline), and shun known low-quality engines. */
function voiceScore(v, lang) {
  const name = (v.name || "").toLowerCase();
  let s = 0;
  if (!v.lang || v.lang.slice(0, 2).toLowerCase() !== lang) return -1;
  for (const good of ["natural", "neural", "premium", "enhanced", "siri"]) {
    if (name.includes(good)) s += 10;
  }
  if (name.includes("espeak") || name.includes("compact")) s -= 10;
  if (v.localService) s += 2;
  if (v.lang.toLowerCase() === STRINGS.speechLang.toLowerCase()) s += 1;
  return s;
}

function voicesFor(lang) {
  if (!("speechSynthesis" in window)) return [];
  return window.speechSynthesis
    .getVoices()
    .filter((v) => voiceScore(v, lang) >= 0)
    .sort((a, b) => voiceScore(b, lang) - voiceScore(a, lang));
}

function pickVoice() {
  const options = voicesFor(state.lang || "en");
  if (!options.length) return null;
  const saved = state.voice && state.voice[state.lang];
  if (saved) {
    const match = options.find((v) => v.name === saved);
    if (match) return match;
  }
  return options[0];
}

/* Voice lists load lazily on some phones; warm them up early. */
if ("speechSynthesis" in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.addEventListener?.("voiceschanged", () => {});
}

function setTalking(on) {
  document.querySelectorAll(".meni-holder").forEach((el) => el.classList.toggle("talking", on));
}

function stopSpeaking() {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  if (audioEl) {
    audioEl.pause();
    audioEl = null;
  }
  speaking = false;
  setTalking(false);
  const btn = document.getElementById("read-btn");
  if (btn) {
    btn.querySelector(".read-label").textContent = STRINGS.readToMe;
    btn.setAttribute("aria-pressed", "false");
  }
}

function startSpeakingUI() {
  speaking = true;
  setTalking(true);
  const btn = document.getElementById("read-btn");
  if (btn) {
    btn.querySelector(".read-label").textContent = STRINGS.stopReading;
    btn.setAttribute("aria-pressed", "true");
  }
}

function speakSynth(text, voiceOverride) {
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  const voice = voiceOverride || pickVoice();
  if (voice) {
    u.voice = voice;
    u.lang = voice.lang;
  } else {
    u.lang = STRINGS.speechLang;
  }
  u.rate = 0.92; // unhurried, senior-paced
  u.pitch = 1;
  u.onend = () => stopSpeaking();
  u.onerror = () => stopSpeaking();
  startSpeakingUI();
  window.speechSynthesis.speak(u);
}

/* When a human recording exists we play it; otherwise the best
   installed voice reads the text. */
function toggleSpeak(text, audioUrl) {
  if (speaking) {
    stopSpeaking();
    return;
  }
  if (audioUrl) {
    audioEl = new Audio(audioUrl);
    audioEl.onended = () => stopSpeaking();
    audioEl.onerror = () => {
      audioEl = null;
      speakSynth(text);
    };
    startSpeakingUI();
    audioEl.play().catch(() => {
      audioEl = null;
      speakSynth(text);
    });
    return;
  }
  speakSynth(text);
}

/* ---------------- Soft chime: two gentle notes when a flower grows ---------------- */

let audioCtx = null;

function playChime() {
  if (!state.chime) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    [[659.25, 0], [783.99, 0.13]].forEach(([freq, dt]) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t + dt);
      gain.gain.exponentialRampToValueAtTime(0.1, t + dt + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.6);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t + dt);
      osc.stop(t + dt + 0.65);
    });
  } catch (e) {
    /* No sound is never an error. */
  }
}

/* ---------------- Rendering helpers ---------------- */

const app = () => document.getElementById("app");

/* Every screen change rebuilds the page, which silently drops keyboard
   and screen-reader focus back to <body>. After each render (except the
   very first page load) focus moves to the new screen's heading so the
   change is announced and Tab starts from the top. */
let firstScreen = true;

function focusScreen() {
  if (firstScreen) {
    firstScreen = false;
    return;
  }
  /* Prefer the heading; a selector list would match <main> first in
     document order, so ask for each in turn. */
  const target =
    app().querySelector("h1") ||
    app().querySelector(".question-text") ||
    app().querySelector("main");
  if (target) {
    target.setAttribute("tabindex", "-1");
    target.focus({ preventScroll: false });
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[ch]);
}

function header() {
  return `
    <header class="app-header">
      <div class="brand"><span class="meni-holder">${MENI.mark()}</span><span>${STRINGS.appName}</span></div>
      <button class="btn-secondary btn-small" id="text-size-btn" type="button">
        <span aria-hidden="true" style="font-weight:800">Aa</span> ${STRINGS.sizeLabel}
      </button>
    </header>`;
}

function wireHeader(returnTo) {
  const btn = document.getElementById("text-size-btn");
  if (btn) btn.addEventListener("click", () => renderSizeChooser({ returnTo }));
}

/* Wayfinding in the app's own metaphor: seed → sprout → flower. */
function stepDots(step) {
  const marks = [
    `<svg viewBox="0 0 16 16" width="16" height="16"><ellipse cx="8" cy="9" rx="4" ry="5" fill="#6B3E14"/></svg>`,
    `<svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 15 V8" stroke="#6C945C" stroke-width="2.4" stroke-linecap="round" fill="none"/><ellipse cx="4.5" cy="6.5" rx="4" ry="2.4" fill="#6C945C" transform="rotate(-35 4.5 6.5)"/><ellipse cx="11.5" cy="6.5" rx="4" ry="2.4" fill="#6C945C" transform="rotate(35 11.5 6.5)"/></svg>`,
    `<svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 15 V9" stroke="#6C945C" stroke-width="2.2" stroke-linecap="round" fill="none"/><g transform="translate(8 6)"><circle cx="0" cy="-3.4" r="2.6" fill="#E8872B"/><circle cx="3.2" cy="1" r="2.6" fill="#E8872B"/><circle cx="-3.2" cy="1" r="2.6" fill="#E8872B"/><circle cx="2" cy="3.4" r="2.6" fill="#E8872B"/><circle cx="-2" cy="3.4" r="2.6" fill="#E8872B"/><circle r="2.2" fill="#FFFDF6"/></g></svg>`,
  ];
  return `<div class="step-dots" aria-hidden="true">
    ${marks.map((m, i) => `<span class="${i + 1 <= step ? "on" : ""}">${m}</span>`).join("")}
  </div>`;
}

function readButton() {
  /* No speech engine and no recordings: render no dead button, ever. */
  const hasClips = typeof AUDIO_FILES !== "undefined" && Object.keys(AUDIO_FILES).length > 0;
  if (!("speechSynthesis" in window) && !hasClips) return "";
  return `<button type="button" class="btn-secondary read-chip" id="read-btn" aria-pressed="false">
    ${ICONS.speaker}<span class="read-label">${STRINGS.readToMe}</span>
  </button>`;
}

function wireRead(text, audioUrl) {
  const btn = document.getElementById("read-btn");
  if (btn) btn.addEventListener("click", () => toggleSpeak(text, audioUrl));
}

function alertBanner(lesson) {
  return lesson.alert
    ? `<div class="alert-banner">${ICONS.warn}<span>${STRINGS.scamAlert}</span></div>`
    : "";
}

/* ---------------- Screen 1: size chooser ---------------- */

function renderSizeChooser(opts = {}) {
  stopSpeaking();
  const firstRun = !state.textScale;
  const current = state.textScale || "A";
  applyScale(current);

  app().innerHTML = `
    ${firstRun ? "" : header()}
    <main>
      ${firstRun ? `
        <div class="hello-stage"><div class="disc">${MENI.waving("delighted")}</div></div>
        <h1 class="center">${STRINGS.hello}</h1>` : ""}
      <div class="card teach-text center" id="size-sample">${STRINGS.sizeSample}</div>
      <div class="size-row" role="group" aria-label="${STRINGS.sizeLabel}">
        <button type="button" class="size-a" data-size="A">A<span class="size-label">${STRINGS.sizeNames[0]}</span></button>
        <button type="button" class="size-aa" data-size="AA">AA<span class="size-label">${STRINGS.sizeNames[1]}</span></button>
        <button type="button" class="size-aaa" data-size="AAA">AAA<span class="size-label">${STRINGS.sizeNames[2]}</span></button>
      </div>
      <div class="btn-stack">
        <button type="button" class="btn-primary" id="size-confirm">${STRINGS.sizeConfirm}</button>
      </div>
      ${firstRun ? `
        <p class="footnote center">${STRINGS.trustLine}</p>
        <p class="footnote center"><button type="button" class="btn-quiet btn-small" id="setup-link" style="margin:0 auto">${STRINGS.setupLink}</button></p>` : ""}
    </main>`;

  let chosen = current;
  const buttons = app().querySelectorAll(".size-row button");
  function mark() {
    buttons.forEach((b) => {
      const on = b.dataset.size === chosen;
      b.classList.toggle("selected", on);
      b.setAttribute("aria-pressed", String(on));
    });
  }
  mark();
  buttons.forEach((b) =>
    b.addEventListener("click", () => {
      chosen = b.dataset.size;
      applyScale(chosen); // the whole screen previews the size, live
      mark();
    })
  );

  document.getElementById("size-confirm").addEventListener("click", () => {
    state.textScale = chosen;
    saveState();
    applyScale(chosen);
    if (opts.returnTo === "garden") renderGarden();
    else renderHome();
  });

  const setupLink = document.getElementById("setup-link");
  if (setupLink) setupLink.addEventListener("click", renderSetup);
  if (!firstRun) wireHeader(opts.returnTo);
  focusScreen();
}

  stopSpeaking();

  document.getElementById("save-question").addEventListener("click", (e) => {

  hillA: "#AFC98B",
  hillB: "#7E9E60",
  stem: "#6C945C",
  flowers: [
    { c: "#F2A6B8", shape: "daisy", center: "#FFFFFF" }, // blush
    { c: "#C9ABE3", shape: "five", center: "#FFFFFF" },  // lilac
    { c: "#F7D486", shape: "daisy", center: "#FFFFFF" }, // butter
    { c: "#F49B6A", shape: "tulip" },                     // soft coral
    { c: "#A9CDE3", shape: "five", center: "#FFFFFF" },  // powder blue
    { c: "#FFFFFF", shape: "daisy", center: "#F5C462" }, // white daisy
  ],
};

/* Which flower grows at position i: every third one is the learner's
   favorite (if they picked one); the rest keep the full pastel mix. */
function flowerFor(i) {
  const f = GARDEN.flowers;
  if (state.favColor != null && i % 3 === 0) return f[state.favColor % f.length];
  return f[i % f.length];
}

function flowerHead(f, topY) {
  if (f.shape === "tulip") {
    return `<g transform="translate(0 ${topY})"><path d="M-8 2 C-9 -11 -4 -15 0 -7 C4 -15 9 -11 8 2 C5 7 -5 7 -8 2 Z" fill="${f.c}" stroke="rgba(0,0,0,0.10)" stroke-width="1"/></g>`;
  }
  if (f.shape === "five") {
    let petals = "";
    for (let p = 0; p < 5; p++) {
      const a = (Math.PI * 2 * p) / 5 - Math.PI / 2;
      petals += `<circle cx="${(9.5 * Math.cos(a)).toFixed(1)}" cy="${(9.5 * Math.sin(a)).toFixed(1)}" r="6.5" fill="${f.c}"/>`;
    }
    return `<g transform="translate(0 ${topY})">${petals}<circle r="5.5" fill="${f.center}"/></g>`;
  }
  let petals = "";
  for (let p = 0; p < 8; p++) {
    const a = (Math.PI * 2 * p) / 8;
    const px = (9 * Math.cos(a)).toFixed(1);
    const py = (9 * Math.sin(a)).toFixed(1);
    petals += `<ellipse cx="${px}" cy="${py}" rx="6" ry="4.5" transform="rotate(${((a * 180) / Math.PI).toFixed(0)} ${px} ${py})" fill="${f.c}" stroke="${f.c === "#FFFFFF" ? "rgba(0,0,0,0.10)" : "none"}" stroke-width="0.8"/>`;
  }
  return `<g transform="translate(0 ${topY})">${petals}<circle r="5" fill="${f.center}"/></g>`;
}

function gardenSVG(count) {
  const groundY = 186;

  /* Fixed planting slots: each flower keeps its spot forever as the
     garden grows, and neighbors never crowd each other. Jitter and
     per-flower scale break the grid so the bed reads hand-planted. */
  const slots = [0, 4, 8, 2, 6, 1, 5, 3, 7];
  const jitter = [0, -7, 5, -4, 8, -6, 3, -9, 6];

  /* Completed lessons bloom; the next lesson is already sprouting.
     Every third flower grows on the back hill (smaller, higher) so the
     garden has depth — the front hill band overlaps the planes. */
  const showSprout = Boolean(nextLesson());
  const total = count + (showSprout ? 1 : 0);
  let backFlowers = "";
  let frontFlowers = "";
  for (let i = 0; i < total; i++) {
    const isSprout = showSprout && i === total - 1;
    const x = 34 + slots[i % 9] * 36.5 + jitter[i % 9] + Math.floor(i / 9) * 18;
    const isBack = !isSprout && i % 3 === 2;
    const fs = isBack ? 0.72 : 0.85 + ((i * 13) % 5) * 0.07;
    const baseY = groundY + ((i * 7) % 10);
    const h = isSprout ? 22 : 42 + ((i * 19) % 26);
    const topY = baseY - h;
    const sw = 3.5 + ((i * 7) % 3);
    const stem = `<path d="M0 ${baseY} Q3 ${baseY - h / 2} 0 ${topY + 5}" fill="none" stroke="${GARDEN.stem}" stroke-width="${sw}" stroke-linecap="round"/>`;
    const leaf = `<ellipse cx="-8" cy="${baseY - h / 2.4}" rx="8" ry="4" fill="${GARDEN.stem}" transform="rotate(-32 -8 ${baseY - h / 2.4})"/>`;

    /* The position lives on an inner group: the CSS sway animation
       replaces the outer group's transform, so it must carry none.
       The translate keeps each flower's base on its ground line after
       scaling (base maps to baseY + lift). */
    const lift = isBack ? -10 : 0;
    const ty = (baseY * (1 - fs) + lift).toFixed(1);
    let fig;
    if (isSprout) {
      fig = `${stem}
        <ellipse cx="-7" cy="${topY + 3}" rx="8" ry="4.5" fill="${GARDEN.stem}" transform="rotate(-35 -7 ${topY + 3})"/>
        <ellipse cx="7" cy="${topY + 3}" rx="8" ry="4.5" fill="${GARDEN.stem}" transform="rotate(35 7 ${topY + 3})"/>`;
    } else {
      fig = `${stem}${leaf}${flowerHead(flowerFor(i), topY)}`;
    }
    const g = `<g class="sway"><g transform="translate(${x} ${ty}) scale(${fs.toFixed(2)})">${fig}</g></g>`;
    if (isBack) backFlowers += g;
    else frontFlowers += g;
  }

  /* Grass tufts along both hill crests: ground texture, hand-placed. */
  const tuft = (x, y, s = 1) =>
    `<path d="M${x} ${y} q${1.5 * s} ${-7 * s} ${3 * s} ${-8 * s} M${x + 4 * s} ${y} q0 ${-6 * s} ${2 * s} ${-9 * s} M${x - 3 * s} ${y} q${-1 * s} ${-5 * s} ${-3 * s} ${-6 * s}" stroke="#5F8A50" stroke-width="2" stroke-linecap="round" fill="none"/>`;
  const backGrass = [52, 148, 262, 330].map((x, k) => tuft(x, 191 + (k % 2) * 4, 0.9)).join("");
  const frontGrass = [24, 108, 196, 292, 344].map((x, k) => tuft(x, 219 + (k % 2) * 5)).join("");

  /* Evening (7pm-6am on the phone’s clock): dusk sky, moon and stars. */
  const hour = new Date().getHours();
  const night = hour >= 19 || hour < 6;
  const sky = night ? ["#DEE4F1", "#EFF3EA"] : GARDEN.sky;
  const skyLight = night
    ? `<mask id="moon-m"><rect width="360" height="240" fill="white"/><circle cx="309" cy="45" r="15" fill="black"/></mask>
       <circle cx="300" cy="50" r="17" fill="#F5C462" mask="url(#moon-m)"/>
       <circle cx="252" cy="36" r="1.8" fill="#F5C462"/><circle cx="272" cy="66" r="1.4" fill="#F5C462"/><circle cx="332" cy="76" r="1.6" fill="#F5C462"/>`
    : `<circle cx="300" cy="52" r="46" fill="url(#glow)"/>
       <circle cx="300" cy="52" r="21" fill="${GARDEN.sun}"/>
       <circle cx="300" cy="52" r="27" fill="none" stroke="${GARDEN.sun}" stroke-width="3" opacity="0.5" stroke-dasharray="1 9" stroke-linecap="round"/>`;

  /* After 5 lessons, Meni moves into the garden for good. */
  const resident = count >= 5 ? MENI.group("classic", "smile", 0.27, 12, 176) : "";

  return `<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${STRINGS.gardenAria(count, showSprout)}">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${sky[0]}"/>
        <stop offset="1" stop-color="${sky[1]}"/>
      </linearGradient>
      <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="${GARDEN.sun}" stop-opacity="0.55"/>
        <stop offset="1" stop-color="${GARDEN.sun}" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="360" height="240" fill="url(#sky)"/>
    ${skyLight}
    <path d="M0 196 Q90 178 180 190 Q270 200 360 186 L360 240 L0 240 Z" fill="${GARDEN.hillA}"/>
    ${backGrass}
    ${backFlowers}
    <path d="M0 214 Q120 202 220 212 Q300 219 360 210 L360 240 L0 240 Z" fill="${GARDEN.hillB}"/>
    ${frontGrass}
    ${frontFlowers}
    ${seasonSVG()}
    ${resident}
    ${visitorsSVG(count)}
  </svg>`;
}

/* Season touches (decorative only, from the phone’s date) and the
   evening sky (from the phone’s clock). The garden lives in real time. */
function seasonSVG() {
  const m = new Date().getMonth(); // 0-11
  if (m === 11 || m <= 1) {
    // winter: snow settles along the hilltops, a few flakes in the air
    return `<path d="M0 196 Q90 178 180 190 Q270 200 360 186 L360 192 Q270 206 180 196 Q90 184 0 202 Z" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="60" cy="70" r="2" fill="#FFFFFF"/><circle cx="130" cy="95" r="1.6" fill="#FFFFFF"/><circle cx="250" cy="80" r="1.8" fill="#FFFFFF"/>`;
  }
  if (m >= 8 && m <= 10) {
    // fall: a pumpkin and two dropped gold leaves
    return `<g transform="translate(104 218)">
      <ellipse rx="12" ry="9" fill="#E8872B"/>
      <ellipse rx="5.5" ry="9" fill="#F49B6A"/>
      <path d="M0 -9 q3 -4 1 -7" fill="none" stroke="#6B3E14" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <ellipse cx="135" cy="224" rx="4" ry="2" fill="#F2B33D" transform="rotate(20 135 224)"/>
    <ellipse cx="86" cy="228" rx="4" ry="2" fill="#F5C462" transform="rotate(-25 86 228)"/>`;
  }
  if (m >= 2 && m <= 4) {
    // spring: a little cluster of new blossoms
    return `<g transform="translate(104 214)">
      <path d="M-8 8 Q-8 0 -6 -4 M0 8 Q0 -2 0 -6 M8 8 Q8 1 6 -3" fill="none" stroke="#6C945C" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-6" cy="-6" r="4" fill="#F2A6B8"/><circle cx="-6" cy="-6" r="1.6" fill="#FFFFFF"/>
      <circle cx="0" cy="-8" r="4" fill="#F2A6B8"/><circle cx="0" cy="-8" r="1.6" fill="#FFFFFF"/>
      <circle cx="6" cy="-5" r="4" fill="#F2A6B8"/><circle cx="6" cy="-5" r="1.6" fill="#FFFFFF"/>
    </g>`;
  }
  // summer: a ladybug rests near the front
  return `<g transform="translate(104 219)">
    <circle r="5.5" fill="#D6452B"/>
    <path d="M0 -5.5 A5.5 5.5 0 0 1 0 5.5" fill="none" stroke="#6B3E14" stroke-width="1.2"/>
    <circle cx="-2.5" cy="-1.5" r="1.1" fill="#1B2036"/><circle cx="2.5" cy="1" r="1.1" fill="#1B2036"/><circle cx="-1.5" cy="2.5" r="1.1" fill="#1B2036"/>
    <circle cx="0" cy="-5.5" r="2.2" fill="#1B2036"/>
  </g>`;
}

/* Milestone visitors: every 5th lesson, the garden gains a resident.
   Decorative only — no streaks, no pressure, nothing is ever lost. */
function visitorsSVG(count) {
  let out = "";
  if (count >= 5) {
    out += `<g class="v-drift"><g transform="translate(84 66)">
      <g class="v-wing-l"><ellipse cx="-6.5" cy="-3" rx="6.5" ry="5" fill="#F2A6B8"/><ellipse cx="-5.5" cy="4" rx="5" ry="3.8" fill="#C9ABE3"/></g>
      <g class="v-wing-r"><ellipse cx="6.5" cy="-3" rx="6.5" ry="5" fill="#F2A6B8"/><ellipse cx="5.5" cy="4" rx="5" ry="3.8" fill="#C9ABE3"/></g>
      <ellipse rx="2.2" ry="7" fill="#6B3E14"/>
      <path d="M-1.5 -6 Q-4 -11 -6 -11 M1.5 -6 Q4 -11 6 -11" fill="none" stroke="#6B3E14" stroke-width="1.4" stroke-linecap="round"/>
    </g></g>`;
  }
  if (count >= 10) {
    out += `<g class="v-float"><path d="M148 52 Q155 44 162 52 M162 52 Q169 44 176 52" fill="none" stroke="#7A93A8" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M104 66 Q109 60 114 66 M114 66 Q119 60 124 66" fill="none" stroke="#7A93A8" stroke-width="2" stroke-linecap="round"/></g>`;
  }
  if (count >= 15) {
    out += `<g class="v-bob"><g transform="translate(224 104)">
      <ellipse cx="-1" cy="-5" rx="4" ry="2.6" fill="#FFFFFF" opacity="0.85"/>
      <ellipse rx="6" ry="4.2" fill="#F5C462"/>
      <path d="M-2 -4 V4 M2 -4 V4" stroke="#6B3E14" stroke-width="1.6"/>
      <circle cx="5" cy="-1" r="1" fill="#1B2036"/>
    </g></g>`;
  }
  if (count >= 20) {
    out += `<g transform="translate(310 0)">
      <ellipse cx="0" cy="224" rx="14" ry="4" fill="#8FA6B8"/>
      <path d="M-4 224 h8 v-16 h-8 z" fill="#9FB4C4"/>
      <ellipse cx="0" cy="206" rx="17" ry="6" fill="#9FB4C4"/>
      <ellipse cx="0" cy="204.5" rx="12" ry="4" fill="#A9CDE3"/>
      <g transform="translate(11 197)">
        <circle r="5" fill="#E8872B"/>
        <circle cx="3" cy="-1.5" r="0.9" fill="#1B2036"/>
        <path d="M5 0 l4 1.5 -4 1.5 z" fill="#F5C462"/>
        <path d="M-4.5 1 q-3 2 -1 4" fill="none" stroke="#6B3E14" stroke-width="1.3" stroke-linecap="round"/>
      </g>
    </g>`;
  }
  return out;
}

function renderGarden() {
  stopSpeaking();
  const count = state.completed.length;
  const next = nextLesson();
  const canActToday = next && !completedToday() && !wateredToday();
  const watering = isWateringDay();

  /* Welcome-back logic: warm, never a count of missed days. */
  let message = STRINGS.gardenGrowing;
  if (!next) message = STRINGS.allDone;
  else if (state.wasAway) message = STRINGS.welcomeBack;
  else if (completedToday()) message = STRINGS.doneToday;
  else if (wateredToday()) message = STRINGS.wateredToday;

  const officeCard = state.officeHoursDate
    ? `<div class="card card-row">
        ${ICONS.calendar}
        <span style="font-weight:700">${STRINGS.officeHours(friendlyDate(state.officeHoursDate))}</span>
      </div>`
    : "";

  const savedList = state.saved.length
    ? `<div class="card saved-questions">
        <h2>${STRINGS.savedQuestionsTitle}</h2>
        <ul>${state.saved.map((q) => `<li>${esc(q.title)}</li>`).join("")}</ul>
      </div>`
    : "";

  app().innerHTML = `
    ${header()}
    <main>
      <h1>${STRINGS.yourGarden}</h1>
      <div class="lessons-learned">
        <span class="big">${count}</span>
        <span class="rest">${STRINGS.lessonsLearnedWord(count)}</span>
      </div>
      <div class="garden-hero">${gardenSVG(count)}</div>
      <div class="meni-says">
        <div class="meni-avatar">${MENI.classic("smile")}</div>
        <div class="bubble">${greeting()} ${message}</div>
      </div>
      ${officeCard}
      ${savedList}
      ${canActToday ? `
        <div class="btn-stack">
          <button type="button" class="btn-primary" id="start-lesson">${watering ? STRINGS.waterBtn : STRINGS.startLesson}</button>
        </div>` : ""}
      ${count >= 3 ? `
        <div class="btn-stack">
          <button type="button" class="btn-secondary" id="skills-btn">${ICONS.spark}${STRINGS.skillsBtn}</button>
        </div>` : ""}
    </main>`;

  wireHeader("garden");
  const start = document.getElementById("start-lesson");
  if (start)
    start.addEventListener("click", () =>
      watering ? renderWateringAsk() : renderLessonTeach(next)
    );
  const skillsBtn = document.getElementById("skills-btn");
  if (skillsBtn) skillsBtn.addEventListener("click", renderSkills);
  focusScreen();
}

/* ---------------- Facilitator setup (hidden route: #setup) ---------------- */

function renderSetup() {
  stopSpeaking();
  const packs = [
    { key: "everyday", label: "Everyday life examples" },
    { key: "work", label: "Work and rights examples" },
  ];

  app().innerHTML = `
    ${header()}
    <main lang="en">
      <h1>Facilitator setup</h1>
      <p>These choices are for the person setting up this phone. The learner never sees this screen or any labels from it.</p>
      <div class="setup-field">
        <label id="lang-label">Learner’s language</label>
        <div class="btn-stack" role="group" aria-labelledby="lang-label" style="margin-top:0">
          <button type="button" class="btn-secondary" data-setlang="en" lang="en">English</button>
          <button type="button" class="btn-secondary" data-setlang="es" lang="es">Español</button>
        </div>
      </div>
      <div class="setup-field">
        <label id="pack-label">Example pack for later lessons</label>
        <div class="btn-stack" role="group" aria-labelledby="pack-label" style="margin-top:0">
          ${packs
            .map(
              (p) =>
                `<button type="button" class="btn-secondary" data-pack="${p.key}">${p.label}</button>`
            )
            .join("")}
        </div>
      </div>
      <div class="setup-field">
        <label for="office-date">Next office hours date</label>
        <input type="date" id="office-date" value="${state.officeHoursDate || ""}">
      </div>
      <div class="setup-field">
        <label for="replant">Replant a garden (lessons already learned)</label>
        <input type="number" id="replant" inputmode="numeric" min="0" max="${sequence().length}" value="${state.completed.length}">
        <p class="footnote" style="margin-top:8px">For a new or replaced phone: enter how many lessons the learner had finished. The garden regrows instantly, and today’s lesson stays available.</p>
      </div>
      <div class="setup-field">
        <label id="voice-label">Read-aloud voice (this phone’s best voices for the learner's language)</label>
        <div class="btn-stack" role="group" aria-labelledby="voice-label" style="margin-top:0" id="voice-list"></div>
        <p class="footnote" style="margin-top:8px">Tap a voice to hear it and choose it. Recorded human audio, when added, always plays instead (see the project's audio guide).</p>
      </div>
      <div class="setup-field">
        <label id="chime-label">Soft chime when a flower grows</label>
        <div class="btn-stack" role="group" aria-labelledby="chime-label" style="margin-top:0">
          <button type="button" class="btn-secondary" data-chime="on">Chime on</button>
          <button type="button" class="btn-secondary" data-chime="off">Chime off</button>
        </div>
      </div>
      <div class="btn-stack">
        <button type="button" class="btn-primary" id="setup-done">Done — back to Meni</button>
      </div>
      <div class="btn-stack">
        <button type="button" class="btn-quiet" id="reset-btn">Start over (erase all progress on this phone)</button>
      </div>
      <p class="footnote center">${STRINGS.trustLine}</p>
    </main>`;

  wireHeader();

  const langButtons = app().querySelectorAll("[data-setlang]");
  function markLang() {
    langButtons.forEach((b) => {
      const on = b.dataset.setlang === (state.lang || "en");
      b.classList.toggle("selected", on);
      b.setAttribute("aria-pressed", String(on));
    });
  }
  markLang();
  langButtons.forEach((b) =>
    b.addEventListener("click", () => {
      setLang(b.dataset.setlang);
      saveState();
      markLang();
      renderVoiceList(); // voices differ per language
    })
  );

  const packButtons = app().querySelectorAll("[data-pack]");
  function markPack() {
    packButtons.forEach((b) => {
      const on = b.dataset.pack === state.pack;
      b.classList.toggle("selected", on);
      b.setAttribute("aria-pressed", String(on));
    });
  }
  markPack();
  packButtons.forEach((b) =>
    b.addEventListener("click", () => {
      state.pack = b.dataset.pack;
      saveState();
      markPack();
    })
  );

  document.getElementById("office-date").addEventListener("change", (e) => {
    state.officeHoursDate = e.target.value || null;
    saveState();
  });

  /* Voice chooser: the top-ranked voices for the learner's language.
     Tapping previews AND selects — hearing it is the only way to judge. */
  function renderVoiceList() {
    const list = document.getElementById("voice-list");
    if (!list) return;
    const lang = state.lang || "en";
    const options = voicesFor(lang).slice(0, 6);
    if (!options.length) {
      list.innerHTML = `<p class="footnote" style="margin:0">No voices found on this phone yet — try again after the page finishes loading.</p>`;
      return;
    }
    const chosen = (state.voice && state.voice[lang]) || options[0].name;
    list.innerHTML = options
      .map(
        (v) =>
          `<button type="button" class="btn-secondary${v.name === chosen ? " selected" : ""}" aria-pressed="${v.name === chosen}" data-voice="${esc(v.name)}">${esc(v.name.replace(/\s*\(.*\)\s*$/, ""))}</button>`
      )
      .join("");
    list.querySelectorAll("[data-voice]").forEach((b) =>
      b.addEventListener("click", () => {
        if (!state.voice) state.voice = { en: null, es: null };
        state.voice[lang] = b.dataset.voice;
        saveState();
        stopSpeaking();
        const v = voicesFor(lang).find((x) => x.name === b.dataset.voice);
        speakSynth(lang === "es" ? I18N.es.hello + " " + I18N.es.gardenGrowing : I18N.en.hello + " " + I18N.en.gardenGrowing, v);
        renderVoiceList();
      })
    );
  }
  renderVoiceList();
  if ("speechSynthesis" in window) {
    window.speechSynthesis.addEventListener?.("voiceschanged", renderVoiceList, { once: true });
  }

  const chimeButtons = app().querySelectorAll("[data-chime]");
  function markChime() {
    chimeButtons.forEach((b) => {
      const on = (b.dataset.chime === "on") === state.chime;
      b.classList.toggle("selected", on);
      b.setAttribute("aria-pressed", String(on));
    });
  }
  markChime();
  chimeButtons.forEach((b) =>
    b.addEventListener("click", () => {
      state.chime = b.dataset.chime === "on";
      saveState();
      markChime();
      if (state.chime) playChime();
    })
  );

  /* Replant: rebuild progress as the first N lessons, dated long ago so
     today’s lesson is still available. The garden never shrinks by
     accident — this is a deliberate facilitator action. */
  document.getElementById("replant").addEventListener("change", (e) => {
    const n = Math.max(0, Math.min(sequence().length, Number(e.target.value) || 0));
    e.target.value = n;
    if (n === state.completed.length) return;
    state.completed = sequence()
      .slice(0, n)
      .map((l) => ({ id: l.id, date: "1970-01-01" }));
    saveState();
  });

  document.getElementById("setup-done").addEventListener("click", () => {
    if (location.hash === "#setup") {
      history.replaceState(null, "", location.pathname + location.search);
    }
    renderHome();
  });

  /* Two-step erase, inline (no popups anywhere in the app). The armed
     state disarms after a few seconds so a stray tap minutes later can
     never erase a garden. */
  const resetBtn = document.getElementById("reset-btn");
  let armed = false;
  let disarmTimer = null;
  function disarm() {
    armed = false;
    clearTimeout(disarmTimer);
    resetBtn.textContent = "Start over (erase all progress on this phone)";
    resetBtn.className = "btn-quiet";
  }
  resetBtn.addEventListener("blur", () => {
    if (armed) disarm();
  });
  resetBtn.addEventListener("click", () => {
    if (!armed) {
      armed = true;
      resetBtn.textContent = "Tap again to erase everything";
      resetBtn.className = "btn-secondary";
      disarmTimer = setTimeout(disarm, 6000);
      return;
    }
    clearTimeout(disarmTimer);
    localStorage.removeItem(STORE_KEY);
    state = defaultState();
    setLang("en");
    state.lang = null; // the next learner picks their own language
    applyScale("A");
    renderLanguagePick();
  });
  focusScreen();
}

/* ---------------- Routing ---------------- */

function renderHome() {
  if (!state.lang) {
    renderLanguagePick();
    return;
  }
  if (!state.textScale) {
    renderSizeChooser();
    return;
  }
  applyScale(state.textScale);
  if (!state.favAsked) {
    renderColorPick();
    return;
  }
  const next = nextLesson();
  if (!next || completedToday() || wateredToday()) renderGarden();
  else if (isWateringDay()) renderWateringAsk();
  else renderLessonTeach(next);
}

function boot() {
  /* Was the learner away? Decide before stamping today’s visit.
     "Away" means at least one full missed day — never counted, never shown. */
  const t = todayStr();
  state.wasAway = Boolean(state.lastVisit && daysBetween(state.lastVisit, t) >= 2);
  state.lastVisit = t;
  saveState();

  /* Load strings for the saved language; phones set up before the
     language choice existed keep English until they pick otherwise. */
  if (state.lang) setLang(state.lang);

  if (state.textScale) applyScale(state.textScale);

  if (location.hash === "#setup") renderSetup();
  else renderHome();

  window.addEventListener("hashchange", () => {
    if (location.hash === "#setup") renderSetup();
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {
      /* Offline support is a bonus, never a blocker. */
    });
  }
}

document.addEventListener("DOMContentLoaded", boot);

</script>
</body>
</html>
