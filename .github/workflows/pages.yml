# Deploys the app to GitHub Pages. The site is fully static — the whole
# repo is the artifact; no build step exists on purpose.
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# Deploys run on every push to main, or on demand from the Actions tab
# (workflow_dispatch works from any branch, useful before main exists).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
